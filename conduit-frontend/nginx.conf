server {
    listen 80;

    location / {
        root   /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: browser only ever talks to this nginx origin, which
    # forwards /api requests to the backend container over Docker's
    # internal network. Avoids hardcoding the backend host/IP into the
    # Angular bundle and sidesteps CORS entirely (same-origin from the
    # browser's point of view).
    location /api {
        proxy_pass http://conduit-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
